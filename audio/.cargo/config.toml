# The DLL is loaded into NVDA's process on machines that may lack the Visual C++ redistributable,
# so link the C runtime statically: no vcruntime140.dll dependency at all.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[env]
# libopus (bundled with audiopus_sys) still declares cmake_minimum_required 3.1, which CMake 4
# refuses to configure without this.
CMAKE_POLICY_VERSION_MINIMUM = "3.5"
